name: Publish to NPM

# Release routine: bump "version" in package.json on main (through a PR), then
# publish a GitHub release (tag vX.Y.Z, with your release notes). That starts
# this workflow. Run it by hand only to retry a release that failed.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never run two publishes at once.
concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Typecheck, lint, build and the full jest suite on every supported Node version.
  tests:
    uses: ./.github/workflows/pr-test.yml
    permissions:
      contents: read
      pull-requests: write  # pr-test.yml asks for it; its comment step is skipped outside pull requests

  # Build the package tarball with no npm access and no write access.
  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20.x'

      # Catches a release made before bumping package.json, or tagged with the wrong version.
      - name: Check version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          if npm view "@traccia/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@traccia/sdk@$VERSION is already on npm. Bump version in package.json first"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build and pack
        run: |
          npm run build
          npm pack
          mv traccia-sdk-*.tgz package.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: package
          path: package.tgz
          retention-days: 7

  # Publishes with npm trusted publishing: npm checks this job's GitHub OIDC
  # token, so there is no npm token to steal. Waits for approval in the "npm"
  # environment and runs no project code: it publishes the tarball built above.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@traccia/sdk
    permissions:
      id-token: write  # Required for trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: package

      # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'

      - name: Publish to NPM
        run: |
          npm --version
          npm publish ./package.tgz --provenance --access public --ignore-scripts
